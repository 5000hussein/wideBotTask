# ---------------------------------------------------------------------------
# OrangeHRM automation - environment configuration
#
# Every value here can be overridden without editing this file:
#   -Dkey=value                 e.g. mvn test -Dbrowser=firefox -Dheadless=false
#   environment variable        e.g. BASE_URL, USERNAME, PASSWORD
#
# Precedence: system property > environment variable > this file.
# See Util/ConfigReader.java.
#
# NOTE ON CREDENTIALS
# These are the public demo credentials published by OrangeHRM on the login
# page of the public sandbox. They are not secret. They live here (and not in
# the test classes) so that pointing the suite at a private environment is a
# config change, not a code change:
#   mvn test -Dbase.url=https://my-hrm.internal -Dusername=qa -Dpassword=***
# ---------------------------------------------------------------------------

base.url=https://opensource-demo.orangehrmlive.com
username=Admin
password=admin123

# chrome | firefox | edge
browser=chrome
headless=true

# seconds
timeout.explicit=20
timeout.pageload=45

# Delete employees created by the suite once the test that owns them is done.
# Set to false to leave records behind for manual inspection after a run.
cleanup.enabled=true
